<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>つぎ足し英作文</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: 白地に余白をたっぷり。太い見出し、ピル型の部品、角の丸いカード、下に固定のボタン。アクセント色は1色だけ */
:root{
  --bg:#FFFFFF; --ink:#222222; --muted:#6A6A6A; --faint:#B0B0B0; --line:#DDDDDD; --line2:#EBEBEB; --soft:#F7F7F7;
  --accent:#D9603B; --accent-ink:#FFFFFF; --accent-soft:#FBEDE7; --solid:#222222; --solid-ink:#FFFFFF;
  --mark:#FFE7A3; --ok:#1E7F55; --hint:#B26B12; --ng:#C13B2C;
  --shadow:0 6px 20px rgba(0,0,0,.08); --shadow-pill:0 3px 14px rgba(0,0,0,.12);
  --tint1:#F3EDE4; --tint2:#E7EEF5; --tint3:#EAF0E2; --tint4:#F5E9EC; --tint5:#ECEAF4;
  --t-core:#222222; --t-place:#0D8587; --t-time:#B8740B; --t-with:#7448CC; --t-by:#2477C9;
  --t-for:#BF3F74; --t-purpose:#3A8A2B; --t-desc:#5F6476; --t-reason:#B0442A; --t-cond:#4A68AA;
  --f-body:"DM Sans","Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  --f-en:"DM Sans","Helvetica Neue",Arial,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121212; --ink:#F2F2F2; --muted:#A8A8A8; --faint:#6E6E6E; --line:#3A3A3A; --line2:#2A2A2A; --soft:#1C1C1C;
  --accent:#EE7A55; --accent-ink:#1A0D08; --accent-soft:#3A2219; --solid:#F2F2F2; --solid-ink:#121212;
  --mark:#5C4A12; --ok:#4FC58B; --hint:#E3A447; --ng:#F07A5A;
  --shadow:0 6px 20px rgba(0,0,0,.4); --shadow-pill:0 3px 14px rgba(0,0,0,.5);
  --tint1:#2A2620; --tint2:#1E252D; --tint3:#222A1C; --tint4:#2D2125; --tint5:#24222E;
  --t-core:#F2F2F2; --t-place:#3CC4C6; --t-time:#E6A83C; --t-with:#A98BF0; --t-by:#64AEF0;
  --t-for:#EE7AA7; --t-purpose:#7CC96B; --t-desc:#A3A8BB; --t-reason:#EC8366; --t-cond:#8EA6E0;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121212; --ink:#F2F2F2; --muted:#A8A8A8; --faint:#6E6E6E; --line:#3A3A3A; --line2:#2A2A2A; --soft:#1C1C1C;
  --accent:#EE7A55; --accent-ink:#1A0D08; --accent-soft:#3A2219; --solid:#F2F2F2; --solid-ink:#121212;
  --mark:#5C4A12; --ok:#4FC58B; --hint:#E3A447; --ng:#F07A5A;
  --shadow:0 6px 20px rgba(0,0,0,.4); --shadow-pill:0 3px 14px rgba(0,0,0,.5);
  --tint1:#2A2620; --tint2:#1E252D; --tint3:#222A1C; --tint4:#2D2125; --tint5:#24222E;
  --t-core:#F2F2F2; --t-place:#3CC4C6; --t-time:#E6A83C; --t-with:#A98BF0; --t-by:#64AEF0;
  --t-for:#EE7AA7; --t-purpose:#7CC96B; --t-desc:#A3A8BB; --t-reason:#EC8366; --t-cond:#8EA6E0;
  color-scheme:dark}
html,body{min-height:100%;background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{word-break:keep-all;overflow-wrap:break-word;line-break:strict}
#app p,.small,.note,.sub,.cat .en,.row span span,.tile span span{text-wrap:pretty}
.wrap{max-width:460px;margin:0 auto;padding-block:12px 0;display:flex;flex-direction:column;gap:18px;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;background:none;border:0;padding:0}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.en{font-family:var(--f-en)}
.glass{background:var(--bg);border:1px solid var(--line);border-radius:var(--r)}
.small{font-size:12.5px;color:var(--muted);margin:0}
.foot{color:var(--muted);font-size:12px;text-align:center;padding-bottom:28px;margin:0}
.banner{font-size:13px;border-radius:12px;padding:10px 14px;color:var(--muted);background:var(--soft)}
.chipbtn,.seg button,.pill,.scount,.way .wh .small{white-space:nowrap;flex-shrink:0}

/* ヘッダー */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);display:flex;align-items:flex-end;justify-content:center;gap:3px;padding:8px 7px}
.logo i{width:4px;border-radius:2px;background:var(--accent-ink)}
.logo i:nth-child(1){height:8px;opacity:.6}.logo i:nth-child(2){height:13px;opacity:.8}.logo i:nth-child(3){height:18px}
.brand b{font-weight:700;font-size:20px;letter-spacing:-.01em}
.round{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;flex-shrink:0}
.round svg{width:17px;height:17px}
.top.bar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px}
.top.bar .navt{min-width:0;line-height:1.3;overflow-wrap:anywhere;text-align:center;font-weight:700;font-size:14.5px}
.top.bar .navt small{display:block;margin:0;color:var(--muted);font-weight:400;font-size:12px;font-variant-numeric:tabular-nums}
.top.bar>:last-child{justify-self:end}
.navl{display:flex;gap:6px;align-items:center;justify-self:start}
.homebtn{display:inline-flex;align-items:center;gap:5px;height:38px;padding:0 13px 0 10px;border-radius:999px;font-size:13px;font-weight:500;border:1px solid var(--line)}
.homebtn svg{width:16px;height:16px}

/* ホーム：ピル型の「今日の練習」 */
.pillbar{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line2);border-radius:999px;padding:10px 10px 10px 20px;box-shadow:var(--shadow-pill);background:var(--bg)}
.pillbar .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.pillbar .t b{font-size:15px;font-weight:700}
.pillbar .t span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pillbar .go{width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex-shrink:0}
.pillbar .go svg{width:16px;height:16px}

/* ホーム：5つのパターン（アイコンのタブ） */
.cats-row{display:flex;flex-direction:column;gap:10px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sechead b{font-size:17px;font-weight:700;letter-spacing:-.01em}
.sechead button,.sechead a{font-size:13px;font-weight:500;text-decoration:underline;flex-shrink:0}
.iconrow{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line2)}
.iconrow button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 2px 10px;color:var(--muted);font-size:11.5px;line-height:1.3;text-align:center;border-bottom:2px solid transparent}
.iconrow button span{white-space:nowrap}
.iconrow svg{width:24px;height:24px;color:var(--ink)}
.iconrow button:hover{color:var(--ink);border-bottom-color:var(--line)}

/* ホーム：ステップのカード */
.scards{display:flex;flex-direction:column;gap:26px}
.scard{display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.sviz{position:relative;border-radius:16px;background:var(--tint);min-height:150px;display:flex;align-items:center;justify-content:center;padding:34px 16px 20px}
.sviz .sent{gap:8px 5px}
.sviz .chunk .txt{font-size:16px;background:var(--bg)}
.sviz .badge{position:absolute;top:12px;left:12px;background:var(--bg);color:var(--ink);font-size:12px;font-weight:700;border-radius:999px;padding:4px 11px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.sviz .stepno{position:absolute;top:10px;right:14px;font-family:var(--f-en);font-weight:700;font-size:13px;color:var(--muted)}
.smeta{display:flex;flex-direction:column;gap:2px}
.srow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.srow b{font-size:15.5px;font-weight:700}
.scount{font-size:13.5px;font-variant-numeric:tabular-nums}
.ssub{font-size:13.5px;color:var(--muted)}
.bar{display:flex;gap:3px;margin-top:6px;flex-wrap:wrap}
.bar i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.bar i.ok{background:var(--ok)}.bar i.hint{background:var(--hint)}.bar i.ng{background:var(--ng)}
.scard.cur .sviz{outline:2px solid var(--ink);outline-offset:3px}

/* ホーム：一覧の行 */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:16px 0;border-bottom:1px solid var(--line2)}
.row .ic{width:26px;display:grid;place-items:center;flex-shrink:0}
.row .ic svg{width:22px;height:22px}
.row>span:nth-child(2){flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row b{font-size:15px;font-weight:500}
.row span span{font-size:12.5px;color:var(--muted)}
.row .chev{color:var(--muted);flex-shrink:0}
.row .chev svg{width:16px;height:16px}

/* タイル（結果画面などで使用） */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;padding:14px;border-radius:var(--r)}
.tile .ic svg{width:22px;height:22px}
.tile b{display:block;font-size:14.5px;font-weight:700}
.tile span span{display:block;font-size:12px;color:var(--muted);line-height:1.4}

/* 一覧・記録・パターン */
.panel{padding:18px;display:flex;flex-direction:column;gap:12px}
.panel h2{margin:0;font-size:17px;font-weight:700}
.panel.glass{border:0;border-radius:0;padding:0 0 22px;border-bottom:1px solid var(--line2)}
.panel.glass h2{font-size:20px}
.dock:empty{display:none}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:4px}
.cat .nm{font-weight:700;font-size:14px;display:flex;gap:7px;align-items:flex-start}
.cat .nm i{width:8px;height:8px;border-radius:50%;background:var(--c);margin-top:7px;flex-shrink:0}
.cat .en{font-size:12px;color:var(--muted)}
.marks{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px}
.marks i{width:9px;height:9px;border-radius:3px;background:var(--line2)}
.marks i.ok{background:var(--ok)}.marks i.hint{background:var(--hint)}.marks i.ng{background:var(--ng)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{display:flex;flex-direction:column;align-items:flex-start;padding:14px;border-radius:var(--r);border:1px solid var(--line)}
.stat b{font-family:var(--f-en);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:11.5px;color:var(--muted);line-height:1.35;margin-top:4px}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.days i{aspect-ratio:1;border-radius:4px;background:var(--line2);max-width:100%}
.days i.d1{background:var(--accent-soft)}.days i.d2{background:var(--accent)}
.li{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line2);align-items:center;font-size:14px}
.li:first-of-type{border-top:0}
.li .q{min-width:0}
.chip{font-size:11.5px;border-radius:999px;padding:3px 10px;font-weight:500;border:1px solid currentColor;flex-shrink:0}
.chip.none{color:var(--faint)}
.hist{display:flex;flex-direction:column}
.hrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 0;border-top:1px solid var(--line2);font-size:14px}
.hrow:first-child{border-top:0}
.hrow .hn{width:24px;flex-shrink:0;color:var(--muted);font-family:var(--f-en);font-variant-numeric:tabular-nums;font-size:13px}
.hrow .q{flex:1;min-width:0}
.hrow.next .q{font-weight:700}
.hrow.next .pill{background:var(--accent);color:var(--accent-ink)}
.chip.ok{color:var(--ok)}.chip.hint{color:var(--hint)}.chip.ng{color:var(--ng)}
.chipbtn{border:1px solid var(--ink);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:500}
.setting{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;align-self:center;padding:3px;border-radius:999px;gap:2px;background:var(--soft);border:1px solid var(--line2)}
.seg button{padding:7px 15px;border-radius:999px;font-size:12.5px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--bg);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.way{display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:var(--r);border:1px solid var(--line)}
.way .wh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.way .wh b{font-size:15.5px;font-weight:700;display:flex;gap:8px;align-items:baseline}
.way .wh b::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c);flex-shrink:0;transform:translateY(-1px)}
.way .ex{display:flex;flex-wrap:wrap;gap:8px 6px;align-items:flex-end}

/* パターン解説ページ */
.pt-sec{display:flex;flex-direction:column;gap:12px;padding-bottom:22px;border-bottom:1px solid var(--line2)}
.pt-sec h3{margin:0;font-size:17px;font-weight:700}
.pt-order{display:flex;flex-direction:column;gap:10px}
.pt-jp,.pt-en{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:12px}
.pt-jp{background:var(--soft)}.pt-jp b{font-size:16px;font-weight:500}
.pt-en{border:1px solid var(--line)}
.pt-points{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px;font-size:14.5px;line-height:1.7}
.pt-table{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pt-table div{display:grid;grid-template-columns:minmax(88px,auto) 1fr;gap:12px;padding:10px 14px;border-top:1px solid var(--line2);font-size:14px;align-items:baseline}
.pt-table div:first-child{border-top:0}
.pt-table b{font-weight:700}
.pt-ex{display:flex;flex-direction:column;gap:6px}
.pt-ex .ex,.pt-en .ex{display:flex;flex-wrap:wrap;gap:10px 6px;align-items:flex-end}
/* 英文のかたまり */
.sent{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 6px;align-items:flex-end;min-height:52px}
.grp{display:inline-flex;align-items:flex-end;gap:6px;max-width:100%}
.chunk{display:inline-flex;flex-direction:column;gap:2px;align-items:flex-start}
.chunk .tag{font-size:10.5px;font-weight:700;color:var(--c)}
.chunk .txt{font-family:var(--f-en);font-size:19px;font-weight:500;padding:3px 9px 4px;border-radius:9px;border:1px solid var(--line);background:var(--bg);box-shadow:inset 0 -3px 0 var(--c)}
.chunk.new .txt{background:var(--mark);animation:pop .4s ease-out both}
.chunk.jp .txt{font-family:var(--f-body);font-size:14px}
.chunk.ghost .txt{color:var(--muted);border-style:dashed;box-shadow:none}
.plus{font-family:var(--f-en);color:var(--faint);font-size:16px;padding-bottom:6px}
@keyframes pop{0%{transform:scale(.9);opacity:.3}100%{transform:none;opacity:1}}

/* 練習画面 */
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;border:0;padding:0}
.tab{display:flex;flex-direction:column;gap:7px;font-size:11.5px;color:var(--faint);font-weight:500}
.tab::before{content:"";height:3px;border-radius:2px;background:var(--line2)}
.tab i{display:none}
.tab.done{color:var(--muted)}.tab.done::before{background:var(--ink)}
.tab.cur{color:var(--ink)}.tab.cur::before{background:var(--accent)}
.qhead{display:flex;flex-direction:column;gap:4px;text-align:left}
.qhead h2{margin:0;font-size:23px;font-weight:700;line-height:1.35;letter-spacing:-.01em;text-wrap:balance}
.qhead p{margin:0;font-size:13.5px;color:var(--muted)}
.stage{display:flex;flex-direction:column;gap:18px;min-height:300px;padding:20px 0 4px;border:0;border-top:1px solid var(--line2);border-radius:0}
.jpq{display:flex;flex-direction:column;gap:4px;padding:16px 18px;border-radius:12px;background:var(--soft)}
.jpq b{font-size:21px;font-weight:700;line-height:1.5;text-wrap:balance}
.jpq .jl{font-size:12px;font-weight:700;color:var(--muted)}
.jsrc{margin:-10px 2px 0}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;border:1px solid var(--line);border-radius:12px;padding:15px 16px;font-size:15.5px}
.opt:hover{border-color:var(--ink)}
.opt.right{border:2px solid var(--ok);padding:14px 15px}
.opt.wrong{border-color:var(--ng);color:var(--muted)}
.note{border-radius:12px;padding:12px 14px;border:1px solid var(--line);font-size:13.5px;text-align:left}
.note.ok{border-color:var(--ok)}.note.ng{border-color:var(--ng)}.note.hi{border-color:var(--hint)}
.micwrap{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:auto}
.micbtn{width:84px;height:84px;border-radius:50%;background:var(--solid);color:var(--solid-ink);display:grid;place-items:center}
.micbtn svg{width:28px;height:28px}
.micbtn small{display:block;font-size:10.5px;margin-top:-1px}
.micbtn.listening{background:var(--accent);color:var(--accent-ink);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(217,96,59,.45)}50%{box-shadow:0 0 0 14px transparent}}
@media (prefers-reduced-motion:reduce){.micbtn.listening{animation:none}.chunk.new .txt{animation:none}}
.heard{font-family:var(--f-en);font-size:14px;color:var(--muted);text-align:center;min-height:1.4em}
.answer{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:auto}
.answer .en{font-size:18px;font-weight:700;text-align:center;text-wrap:balance}
.play{border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;display:inline-flex;gap:6px;align-items:center;font-weight:500}
.play svg{width:14px;height:14px}
.subacts{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.ghost{color:var(--muted);text-decoration:underline;font-size:13px}
.dock{position:sticky;bottom:0;margin:auto calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;gap:14px;align-items:center;justify-content:flex-end;background:var(--bg);border-top:1px solid var(--line2)}
.big{flex:0 1 auto;min-width:46%;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:14px 20px;font-weight:700;font-size:15.5px}
.dock .big:only-child{flex:1}
.big:disabled{background:var(--line2);color:var(--faint);cursor:default}
.big.lite{background:none;color:var(--ink);min-width:0;padding:14px 4px;text-decoration:underline;font-weight:500;margin-right:auto}
.choose{display:flex;flex-direction:column;gap:10px;margin-top:auto}
.pickm{display:flex;gap:14px;align-items:center;text-align:left;padding:16px;border-radius:12px;border:1px solid var(--line)}
.pickm.last{border:2px solid var(--ink);padding:15px}
.pickm .ic{width:44px;height:44px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex-shrink:0}
.pickm .ic svg{width:21px;height:21px}
.pickm b{display:block;font-size:15.5px}
.pickm span span{display:block;font-size:12.5px;color:var(--muted);line-height:1.45}
.typewrap{display:flex;flex-direction:column;gap:6px;margin-top:auto}

const CON={"i'm":"i am","you're":"you are","we're":"we are","they're":"they are","it's":"it is","that's":"that is","there's":"there is","who's":"who is","i'd":"i would","you'd":"you would","i'll":"i will","you'll":"you will","we'll":"we will","let's":"let us","can't":"can not","cannot":"can not","don't":"do not","doesn't":"does not","didn't":"did not","isn't":"is not","aren't":"are not","wasn't":"was not","won't":"will not","hasn't":"has not","i've":"i have"};
const NUM={one:"1",two:"2",three:"3",four:"4",five:"5",six:"6",seven:"7",eight:"8",nine:"9",ten:"10",fifteen:"15",twenty:"20",thirty:"30"};
const SYN={bicycle:"bike",photo:"picture",photos:"pictures"};
const DROP=new Set(["a","an","the","some","um","uh","ah","er","oh"]);
function norm(s){
  s=String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/[^a-z0-9' ]+/g," ");
  return s.split(/\s+/).filter(Boolean).flatMap(w=>{w=w.replace(/^'+|'+$/g,"");return CON[w]?CON[w].split(" "):[w]})
    .map(w=>NUM[w]||SYN[w]||w).join(" ")
    /* 同じ意味の言い方をそろえる（別解として扱う） */
    .replace(/\bwould like to\b/g,"want to").replace(/\bwould like\b/g,"want").replace(/\bwould love to\b/g,"want to")
    .replace(/\bcould you\b/g,"can you").replace(/\bwould you\b/g,"can you").replace(/\bcould i\b/g,"can i").replace(/\bmay i\b/g,"can i")
    .split(" ").filter(w=>w&&!DROP.has(w));
}
function lev1(a,b){/* 1文字違いまでを同じ単語とみなす（打ち間違い用） */if(Math.abs(a.length-b.length)>1)return false;let i=0,j=0,e=0;while(i<a.length&&j<b.length){if(a[i]===b[j]){i++;j++;continue}if(++e>1)return false;if(a.length>b.length)i++;else if(b.length>a.length)j++;else{i++;j++}}return e+(a.length-i)+(b.length-j)<=1}
const same=(x,y)=>x===y||(x.length>=5&&y.length>=5&&lev1(x,y));
function lcs(a,b){const d=Array(b.length+1).fill(0);for(let i=1;i<=a.length;i++){let p=0;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=same(a[i-1],b[j-1])?p+1:Math.max(d[j],d[j-1]);p=t}}return d[b.length]}
function score(said,target){const t=norm(target),s=norm(said);if(!t.length)return 1;return lcs(t,s)/t.length}
/* 4文字以上の単語（意味の中心になる語）は全部そろっていること＋全体の8割以上が一致 */
function keyWordsOk(said,target){const s=norm(said);return norm(target).filter(w=>w.length>=4).every(w=>s.some(x=>same(w,x)))}
function passes(saidList,targets){
  let best=0;for(const s of saidList)for(const t of targets){const sc=score(s,t);const need=norm(t).length<=3?1:0.8;if(sc>=need&&keyWordsOk(s,t))return{ok:true,sc};best=Math.max(best,sc)}
  return{ok:false,sc:best};
}
const strip=s=>s.replace(/[.?!]$/,"");
const endP=s=>(s.match(/[.?!]$/)||["."])[0];
function joinParts(core,ens,adds){let out=strip(core);ens.forEach((en,i)=>{out+=(COMMA.has(adds[i].t)?", ":" ")+en});
  const last=ens[ens.length-1]||"";return /[.?!]$/.test(last)?out:out+endP(core)}
function fullOf(set){return joinParts(set.core,set.adds.map(a=>a.en),set.adds)}
function fullTargets(set){
  const out=[];
  for(const c of [set.core,...set.alt])out.push(joinParts(c,set.adds.map(a=>a.en),set.adds));
  set.adds.forEach((a,i)=>a.alt.forEach(al=>out.push(joinParts(set.core,set.adds.map((b,j)=>j===i?al:b.en),set.adds))));
  return out;
}

/* 聞き取り：PCのChromeは少し間が空くとすぐ止まるため、続けて聞き取り、
   話し終わってから約2秒黙るか、ボタンをもう一度押したら判定する。
   何も話さないまま止まった場合は、最大10秒まで自動で聞き直す。最長20秒。 */
let recCtl=null;
function listen(onInterim){
  return new Promise(resolve=>{
    const t0=Date.now();let parts=[],alts=[],interim="",err=null,done=false,silence=null,userStop=false;
    const said=()=>{const main=(parts.join(" ")+" "+interim).trim();const out=main?[main]:[];
      if(alts.length&&parts.length<=1)alts.forEach(a=>{const x=(a+" "+interim).trim();if(x&&!out.includes(x))out.push(x)});return out};
    const finish=()=>{if(done)return;done=true;clearTimeout(silence);clearTimeout(cap);recCtl=null;rec=null;
      if(err&&["not-allowed","service-not-allowed","audio-capture"].includes(err))micBlocked=true;resolve({said:said(),err})};
    const stopNow=()=>{userStop=true;try{rec&&rec.stop()}catch(e){finish()}};
    const cap=setTimeout(stopNow,20000);
    recCtl={stop:stopNow};
    const start=()=>{
      try{rec=new SR();rec.lang="en-US";rec.interimResults=true;rec.maxAlternatives=3;rec.continuous=true}catch(e){micBlocked=true;err="unsupported";finish();return}
      rec.onresult=ev=>{interim="";for(let i=ev.resultIndex;i<ev.results.length;i++){const r=ev.results[i];
          if(r.isFinal){parts.push(r[0].transcript.trim());alts=[...r].map(x=>x.transcript.trim())}else interim+=r[0].transcript}
        onInterim&&onInterim((parts.join(" ")+" "+interim).trim());
        clearTimeout(silence);silence=setTimeout(stopNow,2000)};
      rec.onerror=ev=>{if(ev.error!=="no-speech"&&ev.error!=="aborted")err=ev.error};
      rec.onend=()=>{
        if(interim){parts.push(interim.trim());interim=""}
        if(!userStop&&!err){
          /* 話している途中で止まった→続きを聞く（2秒黙ると判定）／まだ何も話していない→10秒までは聞き直す */
          if(parts.length||Date.now()-t0<10000){start();return}
        }
        finish()};
      try{rec.start()}catch(e){if(!parts.length){micBlocked=true;err="start"}finish()}
    };
    start();
  });
}

const SLOT_ORDER=["with","by","place","for","time","purpose"];
const CONNECT={and:"そして、",but:"でも、",so:"だから、"};
const pick=a=>a[Math.floor(Math.random()*a.length)];
function genOne(){
  const useRel=Math.random()<0.25;
  if(useRel){
    const f=pick(REL_FRAMES),rel=pick(f.rels);
    const opts=[...f.pre.map(x=>["pre",x]),...f.post.map(x=>["post",x])];
    const conj=opts.length?pick(opts):null;
    const pre=conj&&conj[0]==="pre"?conj[1]:null,post=conj&&conj[0]==="post"?conj[1]:null;
    return build(f.core,[rel],pre,post,rel.jp);
  }
  const f=pick(GEN_FRAMES);const keys=Object.keys(f.slots).filter(k=>f.slots[k].length);
  const pats=[];
  if(keys.length>=2)pats.push("AA","AA","AAC");
  if(keys.length>=1&&(f.pre.length||f.post.length))pats.push("AC","AC");
  if(f.pre.length&&f.post.length)pats.push("CC");
  const pat=pick(pats);
  const nSlots=(pat.match(/A/g)||[]).length;
  const chosenKeys=shuffle(keys).slice(0,nSlots);
  const slots=SLOT_ORDER.filter(k=>chosenKeys.includes(k)).map(k=>pick(f.slots[k]));
  let pre=null,post=null;
  if(pat==="CC"){pre=pick(f.pre);post=pick(f.post)}
  else if(pat.includes("C")){const opts=[...f.pre.map(x=>["pre",x]),...f.post.map(x=>["post",x])];const c=pick(opts);if(c[0]==="pre")pre=c[1];else post=c[1]}
  return build(f.core,slots,pre,post,"");
}
function build(core,slots,pre,post,relJp){
  /* 日本語：〔なぜ・とき〕、〔いつ〕、〔何のために〕、〔誰と〕〔どこで〕〔何で〕〔どのくらい〕＋結論。〔でも・そして・だから〕〜。 */
  const by=k=>slots.find(s=>s.t===k);
  let jp=(pre?pre.jp+"、":"")+(by("time")?by("time").jp+"、":"")+(by("purpose")?by("purpose").jp+"、":"")
    +["with","place","by","for"].map(k=>by(k)?by(k).jp:"").join("")+relJp+core.jp+"。";
  if(post)jp+=CONNECT[post.t]+post.jp+"。";
  const adds=[...slots,...(pre?[pre]:[]),...(post?[post]:[])].map(a=>({...a}));
  const set={lv:"G",cat:"gen",jp,coreJp:core.jp+"。",core:core.en,alt:core.alt,words:[],adds};
  set.id="G-"+fullOf(set).replace(/[^a-z]/gi,"").slice(0,60);
  return set;
}
function genSession(n){
  const out=[],seen=new Set();let guard=0;
  while(out.length<n&&guard++<200){const s=genOne();if(seen.has(s.id))continue;seen.add(s.id);BYID[s.id]=s;out.push(s.id)}
  return out;
}

/* 日本語を文節のまとまりで改行させる：ひらがなの後に漢字・カタカナ・英数字・かっこが来る位置と、「・」「／」の後に改行候補を入れる。
   CSSの word-break:keep-all と組み合わせて、単語の途中で折り返さないようにする */
const RE_H=/[\u3041-\u309F]/,RE_NEXT=/[\u4E00-\u9FFF\u3005\u30A0-\u30FFA-Za-z0-9（「]/,RE_AFTER=/[・／]/;
function fixSlash(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);while(w.nextNode()){const n=w.currentNode;if(n.data.includes(" / "))n.data=n.data.replace(/ \/ /g,"\u00A0/ ")}}
function addWbr(root){fixSlash(root);
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];
  while(w.nextNode()){const n=w.currentNode;const pe=n.parentElement;if(pe.closest("input,textarea,script,style")||getComputedStyle(pe).whiteSpace==="nowrap")continue;if(/[\u3041-\u30FF\u4E00-\u9FFF]/.test(n.data))nodes.push(n)}
  for(const n of nodes){const s=n.data;const cut=[];
    for(let i=1;i<s.length;i++){if((RE_H.test(s[i-1])&&RE_NEXT.test(s[i]))||RE_AFTER.test(s[i-1]))cut.push(i)}
    if(!cut.length)continue;const f=document.createDocumentFragment();let p=0;
    for(const c of cut){f.append(s.slice(p,c),document.createElement("wbr"));p=c}
    f.append(s.slice(p));n.replaceWith(f)}
}

function buildToday(){
  const tried=PRACTICE.filter(s=>store.sets[s.id]);
  const review=tried.filter(s=>lastRes(s.id)!=="ok").sort((a,b)=>store.sets[a.id].last.t-store.sets[b.id].last.t).slice(0,2).map(s=>s.id);
  /* 新しい問題は「今いるステップ」の未挑戦からランダムに選ぶ（毎回同じ1問目にならないように） */
  const lvNow=curLevel();let freshPool=PRACTICE.filter(s=>!store.sets[s.id]&&s.lv===lvNow);
  if(!freshPool.length)freshPool=PRACTICE.filter(s=>!store.sets[s.id]);
  const fresh=shuffle(freshPool).slice(0,Math.max(1,3-review.length)).map(s=>s.id);
  let q=[...fresh,...review];
  if(q.length<3){const pool=shuffle(tried.map(s=>s.id).filter(id=>!q.includes(id)));q=q.concat(pool.slice(0,3-q.length))}
  return q;
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

let backTo="home";
let navStack=[],todayQ=null;
/* 1つ戻る：練習中は1段階前へ（最初の段階なら練習前の画面へ）、それ以外は1つ前の画面へ */
function goBack(){stopRec();banner="";
  if(view==="practice"&&st&&st.si>0){delete st.res[st.si];st.si--;delete st.res[st.si];
    Object.assign(st,{ph:"ready",hint:0,heard:"",typed:"",via:""});if(curStep().k==="pick")st.picked=[];
    render();window.scrollTo(0,0);if(inputMode()==="type"&&curStep().k!=="pick")focusAns();return}
  if(view==="practice"||view==="summary"){view=backTo||"home";render();window.scrollTo(0,0);return}
  view=navStack.pop()||"home";render();window.scrollTo(0,0)}
function startSession(ids,mode="practice"){backTo=view==="practice"||view==="summary"?backTo:view;sess={ids,i:0,res:[],chosen:false,mode};startSet();view="practice";render();window.scrollTo(0,0)}
function startSet(){
  const set=BYID[sess.ids[sess.i]];
  /* ステップ1だけ「結論を選ぶ」から。ステップ2以降は英語にするところから */
  const steps=isTest()?[{k:"full"}]:set.lv===1?[{k:"pick"},{k:"core"},{k:"preview"}]:[{k:"core"}];
  if(!isTest()&&set.lv!==1){set.adds.forEach((a,i)=>steps.push({k:"add",i}));steps.push({k:"full"})}
  const opts=shuffle([{t:set.coreJp,ok:true},{t:set.jp,why:"full"},...(set.adds.length?[{t:set.adds[0].jp,why:"detail"}]:[])]);
  st={set,steps,si:0,res:{},opts,picked:[],ph:"ready",hint:0,heard:""};
  if(steps[0].k!=="pick"&&!sess.chosen)st.ph="choose";
}
const curStep=()=>st.steps[st.si];
const DONE=["passed","revealed","checked"];
function stepTargets(){const s=curStep(),set=st.set;
  if(s.k==="core")return[set.core,...set.alt];
  if(s.k==="add"){const a=set.adds[s.i];return[a.en,...a.alt]}
  if(s.k==="full")return fullTargets(set);return[]}
function stepAnswer(){const s=curStep(),set=st.set;if(s.k==="core")return set.core;if(s.k==="add")return set.adds[s.i].en;if(s.k==="full")return fullOf(set);return""}
function hintList(){const s=curStep(),set=st.set;
  if(s.k==="core")return["語句："+set.words.map(esc).join("　/　"),"出だし：<span class='en'>"+esc(set.core.split(" ").slice(0,2).join(" "))+" …</span>"];
  if(s.k==="add"){const a=set.adds[s.i];const n=["and","but","so","because","when","if","that","who"].includes(a.t)?2:1;return["出だし：<span class='en'>"+esc(a.en.split(" ").slice(0,n).join(" "))+" …</span>"]}
  if(isStepTest())return[];
  if(s.k==="full"&&isTest())return["順番："+[set.coreJp.replace(/[。？]/g,""),...set.adds.map(a=>a.jp)].map(esc).join(" → ")];
  if(s.k==="full")return["順番："+[set.coreJp.replace(/[。？]/g,""),...set.adds.map(a=>a.jp)].map(esc).join(" → "),
    "出だし：<span class='en'>"+[set.core.split(" ").slice(0,2).join(" "),...set.adds.map(a=>a.en.split(" ")[0])].map(w=>esc(w)+" …").join(" ／ ")+"</span>"];
  return[]}
function builtHTML(){
  const set=st.set,s=curStep(),done=DONE.includes(st.ph)||st.ph==="selfcheck";
  if(s.k==="core"&&!done)return`<div class="sent"><span class="small">ここに英文ができていきます</span></div>`;
  if(s.k==="full"&&!done)return`<div class="sent"><span class="small">ヒントなしで、最初から言ってみよう</span></div>`;
  const parts=[chunk("core",dispText(set,-1),{isNew:s.k==="core"})];
  set.adds.forEach((a,i)=>{
    const shown=(s.k==="add"&&(i<s.i||(i===s.i&&done)))||s.k==="full";
    if(shown)parts.push(plusChunk(a.t,dispText(set,i),{isNew:s.k==="add"&&i===s.i}));
    else if(s.k==="add"&&i===s.i)parts.push(plusChunk(a.t,a.jp,{jp:true,ghost:true}));
  });
  return`<div class="sent">${parts.join("")}</div>`;
}
function tabsHTML(){
  const set=st.set,s=curStep();
  if(isTest())return`<div class="tabs glass"><span class="tab cur"><i>!</i>ヒントなしで、最初から全部言う</span></div>`;
  const names=set.lv===1?["結論を選ぶ","英語にする","まとめ"]:["英語にする","後ろに足す","通しで言う"];

}

    if(s.k==="add"){const a=set.adds[s.i];h2="後ろに「"+a.jp+"」を足そう";sub=TY(a.t).l+"を足す　"+(s.i+1)+" / "+set.adds.length}

    }else if(DONE.includes(st.ph)){

        <span class="en">${esc(stepAnswer())}</span><button class="play" data-act="play" data-t="${esc(stepAnswer())}">${IC.spk}お手本</button>
        ${st.heard?`<span class="heard">${st.via==="type"?"入力":"聞き取り"}：${esc(st.heard)}</span>`:""}</div>`;
      dock=`<button class="big" data-act="next">${st.si===st.steps.length-1?(sess.i+1<sess.ids.length?"次の問題へ":"結果を見る"):"次へ"}</button>`;
    }else if(st.ph==="selfcheck"){
      stage+=`<div class="answer"><span class="en">${esc(stepAnswer())}</span><button class="play" data-act="play" data-t="${esc(stepAnswer())}">${IC.spk}お手本</button><span class="small">声に出した英語と比べて、どうでしたか？</span></div>`;
      dock=`<button class="big lite" data-act="self" data-v="ng">言えなかった</button><button class="big" data-act="self" data-v="ok">言えた</button>`;
    }else if(inputMode()==="type"){
      stage+=`<div class="typewrap"><label class="small" for="ans">英語で入力してください</label>
        <input id="ans" class="en" type="text" value="${esc(st.typed||"")}" autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false" lang="en" enterkeyhint="done" placeholder="${s.k==="add"?"続きだけでも、最初からでもOK":""}"></div>`;
      if(st.ph==="retry")stage+=`<div class="note hi">惜しい！足りない単語か、違う単語があります。直してもう一度。</div>`;
      dock=`<button class="big lite" data-act="giveup">答えを見る</button><button class="big" data-act="typecheck">答え合わせ</button>`;
    }else if(mode==="mic"){
      const lis=st.ph==="listening";
      stage+=`<div class="micwrap"><button class="micbtn ${lis?"listening":""}" data-act="mic" aria-label="${lis?"止める":"話す"}"><span>${IC.mic}<small>${lis?"止めて判定":"話す"}</small></span></button>
        <div class="heard" id="heard">${lis?"聞いています。話し終わったら少し待つか、ボタンを押してください":st.ph==="retry"?"聞き取り：「"+esc(st.heard||"聞き取れませんでした")+"」":"押してから英語で話してください"}</div></div>`;
      if(st.ph==="retry")stage+=`<div class="note hi">惜しい！もう一度、またはヒントを見てから挑戦してみよう。</div>`;
      dock=`<button class="big lite" data-act="giveup">答えを見る</button>`;
    }else{
      stage+=`<div class="micwrap"><p class="small" style="text-align:center">まず声に出して言ってから、<br>下のボタンで答えを確認します。</p></div>`;
      dock=`<button class="big" data-act="reveal-self">言ったので答えを見る</button>`;
    }
    if(st.ph!=="choose"&&!DONE.includes(st.ph)&&st.ph!=="selfcheck"){
      const acts=[];if(st.hint<hl.length)acts.push(`<button class="chipbtn" data-act="hint">ヒント${hl.length>1?`（${st.hint+1}/${hl.length}）`:""}</button>`);
      if(st.ph==="retry")acts.push(`<button class="ghost" data-act="override">${inputMode()==="type"?"合っているはずなのに判定されなかった":"言えていたのに判定されなかった"}</button>`);
      under=acts.length?`<div class="subacts">${acts.join("")}</div>`:"";
    }
    const R=store.settings.rate;
    if(st.ph!=="choose")under+=`<div class="seg glass"><button class="${R===0.75?"on":""}" data-act="rate" data-v="0.75">ゆっくり</button><button class="${R===0.9?"on":""}" data-act="rate" data-v="0.9">ふつう</button></div>`;
  }
  app.innerHTML=`<header class="top bar"><span class="navl"><button class="round" data-act="back" aria-label="1つ戻る" title="1つ戻る">${IC.back}</button><button class="homebtn glass" data-act="go" data-v="home" aria-label="ホームに戻る">${IC.home}<span>ホーム</span></button></span><div class="navt">${esc(lvl)}<small>${sess.i+1} / ${sess.ids.length}</small></div><button class="round" data-act="input" data-v="${inputMode()==="type"?"voice":"type"}" aria-label="${inputMode()==="type"?"声に出す練習に切り替え":"タイピング練習に切り替え"}" title="${inputMode()==="type"?"声に出す練習に切り替え":"タイピング練習に切り替え"}">${inputMode()==="type"?IC.mic:IC.key}</button></header>
  ${tabsHTML()}
  <div class="qhead"><h2>${esc(h2)}</h2><p>${esc(sub)}</p></div>
  <section class="glass stage">${promptHTML(set,s)}${stage}</section>
  ${under}
  ${banner?`<div class="banner">${esc(banner)}</div>`:""}
  <div class="dock">${dock}</div>`;
}

/* いま英語にする日本語を大きく、元の文は小さく添える */
function promptHTML(set,s){
  if(s.k==="core")return`<div class="jpq"><span class="jl">英語にする文</span><b>${esc(set.coreJp)}</b></div><p class="small jsrc">元の文：${esc(set.jp)}</p>`;
  if(s.k==="add"){const a=set.adds[s.i];return`<div class="jpq"><span class="jl" style="color:var(${TY(a.t).c})">後ろに足す（${esc(TY(a.t).l)}）</span><b>${esc(a.jp)}</b></div><p class="small jsrc">元の文：${esc(set.jp)}</p>`}
  return`<div class="jpq">${s.k==="full"&&!isTest()?'<span class="jl">英語にする文（全部）</span>':""}<b>${esc(set.jp)}</b></div>`;
}
function setResult(r){st.res[st.si]=r}
function finishSet(){
  const set=st.set;const order={ok:0,hint:1,ng:2};let worst="ok",stuck=null;
  st.steps.forEach((x,i)=>{const r=st.res[i];if(!r)return;if(order[r]>order[worst])worst=r;if(r!=="ok"&&!stuck)stuck=stepLabel(set,x.k,x.i)});
  if(isTest()){store.tests=store.tests||{};const x=store.tests[sess.mode]||{n:0,ok:0};x.n++;if(worst==="ok")x.ok++;store.tests[sess.mode]=x}
  else{const rec=store.sets[set.id]||{n:0,okN:0,hist:[]};
  rec.n++;if(worst==="ok")rec.okN++;rec.last={t:Date.now(),res:worst,stuck};rec.hist=[...rec.hist,{t:Date.now(),res:worst,stuck}].slice(-6);
  store.sets[set.id]=rec}
  store.days[today()]=(store.days[today()]||0)+1;save();
  sess.res.push({id:set.id,res:worst,stuck});sess.i++;
  if(isTest()&&sess.i>=sess.ids.length){const x=store.tests[sess.mode];const okN=sess.res.filter(r=>r.res==="ok").length;
    x.last={ok:okN,total:sess.ids.length,t:Date.now()};x.best=Math.max(x.best||0,okN);save()}
  if(sess.i>=sess.ids.length){view="summary"}else startSet();
  render();window.scrollTo(0,0);
}
function renderSummary(){
  const lab={ok:"ヒントなし",hint:"ヒントあり",ng:"要復習"};const n=sess.res.filter(r=>r.res==="ok").length;
  app.innerHTML=`<header class="top bar"><span class="navl"><button class="round" data-act="back" aria-label="1つ戻る" title="1つ戻る">${IC.back}</button><button class="homebtn glass" data-act="go" data-v="home" aria-label="ホームに戻る">${IC.home}<span>ホーム</span></button></span><div class="navt">おつかれさまでした</div><span style="width:40px"></span></header>
  <div class="qhead" style="padding-top:8px"><h2>${n} / ${sess.res.length} 問を<br>ヒントなしで言えました</h2><p>止まったところは、学習記録からもう一度練習できます</p></div>
  <section class="glass panel"><div>${sess.res.map(r=>`<div class="li"><span class="q">${esc(BYID[r.id].jp)}${r.stuck?`<br><span class="small">止まったところ：${esc(r.stuck)}</span>`:""}</span><span class="chip ${r.res}">${lab[r.res]}</span></div>`).join("")}</div></section>
  <div class="tiles">${isTest()?(isStepTest()?`<button class="glass tile" data-act="steptest" data-v="${sess.mode.slice(2)}"><span class="ic">${IC.shuf}</span><span><b>もう一度</b><span>同じテストで</span></span></button>`:`<button class="glass tile" data-act="test2"><span class="ic">${IC.shuf}</span><span><b>もう一度</b><span>新しい5問で</span></span></button>`):`<button class="glass tile" data-act="start" data-ids="${sess.ids.join(",")}"><span class="ic">${IC.shuf}</span><span><b>もう一度</b><span>同じ問題で</span></span></button>`}
  <button class="glass tile" data-act="go" data-v="record"><span class="ic">${IC.chart}</span><span><b>学習記録</b><span>止まった場所を見る</span></span></button></div>
  <div class="dock"><button class="big" data-act="today">次の練習へ</button></div>`;
}

/* ---------- 操作 ---------- */
app.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b||b.disabled)return;const act=b.dataset.act;
  if(act==="go"){stopRec();const v=b.dataset.v;if(v==="home")navStack=[];else if(view!==v&&view!=="practice")navStack.push(view);view=v;render();window.scrollTo(0,0)}
  else if(act==="level"){lvView=+b.dataset.v;if(view!=="level")navStack.push(view);view="level";render();window.scrollTo(0,0)}
  else if(act==="back"){goBack()}
  else if(act==="today"){startSession(todayQ&&todayQ.length&&view==="home"?todayQ:buildToday())}
  else if(act==="mix"){startSession(shuffle(PRACTICE.map(s=>s.id)).slice(0,5))}
  else if(act==="test1"){const tried=PRACTICE.filter(s=>store.sets[s.id]&&s.lv!==1).map(s=>s.id);const pool=tried.length>=5?tried:PRACTICE.filter(s=>s.lv!==1).map(s=>s.id);startSession(shuffle(pool).slice(0,5),"t1")}
  else if(act==="test2"){startSession(genSession(5),"t2")}
  else if(act==="steptest"){const n=+b.dataset.v;startSession(STEP_TESTS[n].map(s=>s.id),"st"+n)}
  else if(act==="pattern"){stopRec();if(view!=="pattern")navStack.push(view);patView=+b.dataset.v;view="pattern";render();window.scrollTo(0,0)}
  else if(act==="from"){const ids=LEVELS[+b.dataset.lv-1].ids;startSession(ids.slice(+b.dataset.i))}
  else if(act==="start"){const ids=b.dataset.ids.split(",");
    /* 順番に練習：まだ解いていない問題から始め、解いた問題は後ろに回す */
    startSession([...ids.filter(id=>!store.sets[id]),...ids.filter(id=>store.sets[id])])}
  else if(act==="random"){startSession(shuffle(SETS.filter(s=>s.lv===+b.dataset.lv).map(s=>s.id)).slice(0,5))}
  else if(act==="input"){store.settings.input=b.dataset.v;save();render();if(view==="practice"&&inputMode()==="type")focusAns()}
  else if(act==="typecheck"){typeCheck()}
  else if(act==="judge"){store.settings.judge=b.dataset.v;save();render()}
  else if(act==="rate"){store.settings.rate=+b.dataset.v;save();render();if(view!=="practice")speak("I had breakfast at the hotel this morning.")}
  else if(act==="quit"){stopRec();view=backTo||"home";render()}
  else if(act==="pick"){const o=st.opts[+b.dataset.i];if(st.picked.includes(o))return;st.picked.push(o);if(o.ok)setResult(st.picked.length===1?"ok":"hint");render()}
  else if(act==="next"){st.si++;st.ph="ready";st.hint=0;st.heard="";st.typed="";st.via="";banner="";if(st.si>=st.steps.length)return finishSet();
    if(["core","full"].includes(curStep().k)&&!sess.chosen)st.ph="choose";render();if(st.ph==="ready"&&inputMode()==="type")focusAns()}
  else if(act==="choose"){store.settings.input=b.dataset.v;save();sess.chosen=true;st.ph="ready";render();if(inputMode()==="type")focusAns()}
  else if(act==="finishSet"){finishSet()}
  else if(act==="play"){speak(b.dataset.t)}
  else if(act==="hint"){st.hint++;render();if(inputMode()==="type")focusAns()}
  else if(act==="giveup"){stopRec();setResult("ng");st.ph="revealed";render()}
  else if(act==="reveal-self"){st.ph="selfcheck";render()}
  else if(act==="self"){setResult(b.dataset.v==="ok"?(st.hint?"hint":"ok"):"ng");st.ph="checked";render()}
  else if(act==="override"){setResult(st.hint?"hint":"ok");st.ph="passed";render()}
  else if(act==="mic"){
    if(st.ph==="listening"){stopRec();return}
    st.ph="listening";render();
    const r=await listen(t=>{const h=document.getElementById("heard");if(h)h.textContent=t});
    if(r.err&&micBlocked){banner="この画面ではマイクが使えなかったので、「自分で判定」に切り替えました。";st.ph="ready";render();return}
    const said=r.said||[];st.heard=said[0]||"";
    st.via="voice";
    if(passes(said,stepTargets()).ok){setResult(st.hint?"hint":"ok");st.ph="passed";render()}
    else{st.ph="retry";render()}
  }
});
function focusAns(){const el=document.getElementById("ans");if(el){el.focus();const n=el.value.length;try{el.setSelectionRange(n,n)}catch(e){}}}
function typeCheck(){const v=(document.getElementById("ans")?.value||"").trim();if(!v){focusAns();return}
  st.typed=v;st.heard=v;st.via="type";
  if(passes([v],stepTargets()).ok){setResult(st.hint?"hint":"ok");st.ph="passed";render()}
  else{st.ph="retry";render();focusAns()}}
app.addEventListener("input",e=>{if(e.target.id==="ans"&&st)st.typed=e.target.value});
app.addEventListener("keydown",e=>{if(e.target.id==="ans"&&e.key==="Enter"&&!e.isComposing){e.preventDefault();typeCheck()}});
function stopRec(){if(recCtl)recCtl.stop();else{try{rec&&rec.stop()}catch(e){}}}
render();
</script>
